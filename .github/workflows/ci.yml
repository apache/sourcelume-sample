name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  train:
    name: Tiny-model training smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the spec for record validation
        uses: actions/checkout@v4
        with:
          repository: apache/sourcelume-spec
          path: sourcelume-spec
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --group validate
      - name: Train (tiny smoke settings)
        run: uv run python src/train.py --epochs 1 --chars 20000
      - name: Validate records against the spec
        env:
          # Unpinned main for now: the spec has no published release yet, and
          # validating against the current spec is the point of this check.
          SOURCELUME_SPEC: ${{ github.workspace }}/sourcelume-spec
        run: uv run python scripts/validate-records.py
