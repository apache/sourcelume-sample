name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  train:
    name: Tiny-model training smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --group validate
      - name: Train (tiny smoke settings)
        run: uv run python src/train.py --epochs 1 --chars 20000
      - name: Validate records against the spec
        env:
          # TODO: pin to the spec release once PR #10 (TrainingProvenanceRecord)
          # is merged and published; until then CI validates offline only.
          SOURCELUME_SPEC: ''
        run: |
          if [ -n "$SOURCELUME_SPEC" ]; then
            uv run python scripts/validate-records.py
          else
            echo "record validation skipped: no spec checkout available in CI yet"
          fi
