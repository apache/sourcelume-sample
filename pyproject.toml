[project]
name = "sourcelume-sample"
version = "0.0.1"
description = "Apache Sourcelume sample project: trains a tiny char-level model and emits the full Sourcelume provenance chain."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[dependency-groups]
# Only needed to run `make validate-records` (validates the demo records
# against the Sourcelume spec schemas and SHACL shapes).
validate = [
    "jsonschema>=4.21",
    "pyshacl>=0.26",
    "rdflib>=7.0",
]

[tool.uv]
package = false
